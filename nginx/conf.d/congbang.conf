# congbang.kscold.com → ubuntu-congbang 컨테이너
# Frontend: ubuntu-congbang:3000 (Next.js)
# Backend API: ubuntu-congbang:8080 (Spring Boot)

server {
    listen 80;
    server_name congbang.kscold.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name congbang.kscold.com;

    ssl_certificate     /etc/nginx/ssl/congbang.kscold.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/congbang.kscold.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # Next.js 프론트엔드
    location / {
        proxy_pass http://ubuntu-congbang:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Spring Boot API (trailing slash 제거 → /api/ prefix 보존)
    location /api/ {
        proxy_pass http://ubuntu-congbang:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 파일 업로드 정적 파일
    location /uploads/ {
        proxy_pass http://ubuntu-congbang:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket (Spring Boot)
    location /ws/ {
        proxy_pass http://ubuntu-congbang:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger UI
    location /swagger-ui/ {
        proxy_pass http://ubuntu-congbang:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI docs
    location /v3/api-docs {
        proxy_pass http://ubuntu-congbang:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
