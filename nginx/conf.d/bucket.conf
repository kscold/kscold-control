# bucket.kscold.com — MinIO S3 호환 오브젝트 스토리지 프록시
# MinIO API: localhost:9000
# MinIO Console: localhost:9001 (로컬 접근만)
# 버킷: blog / congbang / galjido
# URL 예시: https://bucket.kscold.com/blog/image.jpg

server {
    listen 80;
    server_name bucket.kscold.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bucket.kscold.com;

    ssl_certificate     /etc/nginx/ssl/bucket.kscold.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/bucket.kscold.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 없는 파일 → 404 (S3처럼)
    proxy_intercept_errors on;
    error_page 403 404 =404 /404;
    location = /404 {
        return 404 '{"error":"not found"}';
        add_header Content-Type application/json;
    }

    # MinIO S3 API 프록시
    location / {
        proxy_pass http://host.docker.internal:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 이미지 캐싱
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
