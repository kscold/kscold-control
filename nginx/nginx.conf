worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 실제 접속 주소 — 맥 호스트의 TCP 프록시(HAProxy)가 PROXY protocol v2로 원래 주소를 넘긴다.
    # Colima 포트 전달은 모든 연결을 도커 게이트웨이(172.18.0.1)로 바꾸므로 헤더 없이는 주소를 알 수 없다.
    # 8080/8443(proxy_protocol) 리스너로 들어온 연결만 주소가 바뀌고, 80/443으로 들어온 연결은 그대로 둔다.
    # 신뢰 대역 밖에서 보낸 PROXY 헤더는 무시된다.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    real_ip_recursive on;
    # nginx 가 직접 만드는 리다이렉트에 컨테이너 안 포트(8080/8443)가 붙지 않게 한다.
    port_in_redirect off;

    # 블로그 API 요청 제한은 블로그 백엔드(ApiRateLimitFilter)에서 한다. 값을 바꿀 때 Nginx를 다시 띄우지 않아도 된다.

    server_tokens off;
    sendfile        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    # 소스 저장소 업로드 대비 — 백엔드 한도(100MB)와 맞춘다.
    client_max_body_size 100M;

    # 검색·AI·광고 크롤러가 다녀갔는지만 종류별로 남긴다. 일반 방문자는 "-" 로 두어 식별 정보를 남기지 않는다.
    # 정규식은 위에서부터 먼저 맞는 것이 쓰이므로 구체적인 이름을 앞에 둔다.
    map $http_user_agent $kscold_crawler {
        default "-";
        ~*mediapartners-google "google-adsense";
        ~*adsbot-google "google-adsbot";
        ~*google-inspectiontool "google-inspection";
        ~*googleother "google-other";
        ~*googlebot "googlebot";
        ~*(yeti|naverbot) "naver";
        ~*(bingbot|msnbot) "bing";
        ~*(daumoa|daum/) "daum";
        ~*duckduckbot "duckduckgo";
        ~*yandexbot "yandex";
        ~*applebot "apple";
        ~*(gptbot|chatgpt-user|oai-searchbot) "openai";
        ~*(claudebot|claude-user|claude-searchbot|anthropic-ai) "anthropic";
        ~*perplexity "perplexity";
        ~*bytespider "bytedance";
        ~*ccbot "commoncrawl";
        ~*(facebookexternalhit|meta-externalagent) "meta";
        ~*(kakaotalk-scrap|twitterbot|slackbot|discordbot|telegrambot|linkedinbot|whatsapp) "link-preview";
    }

    # 쿼리·IP·사용자 식별 정보를 제외한 운영 진단용 로그 포맷
    log_format main escape=json '$time_iso8601 request_id=$request_id host=$host '
                    'method=$request_method uri=$uri status=$status '
                    'bytes=$body_bytes_sent request_time=$request_time '
                    'upstream_time=$upstream_response_time crawler=$kscold_crawler';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # gzip 압축
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/manifest+json
        application/xml
        application/xml+rss
        image/svg+xml;

    # 사이트별 설정 로드
    include /etc/nginx/conf.d/*.conf;
}
