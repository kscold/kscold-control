worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 빈 키는 제한 대상에서 제외된다. 비용·인증 위험이 큰 공개 요청만 IP 단위로 제한한다.
    map "$request_method:$uri" $kscold_auth_limit_key {
        default "";
        ~^POST:/api/auth/(login|register)$ $binary_remote_addr;
    }

    map "$request_method:$uri" $kscold_recovery_limit_key {
        default "";
        ~^POST:/api/auth/(recover-username|request-password-reset)$ $binary_remote_addr;
        "POST:/api/team/private" $binary_remote_addr;
    }

    map "$request_method:$uri" $kscold_external_limit_key {
        default "";
        ~^GET:/api/github/ $binary_remote_addr;
        ~^POST:/api/vault/agent/chat(/stream)?$ $binary_remote_addr;
        ~^POST:/api/feeds/copilot/(plan|draft)/?$ $binary_remote_addr;
    }

    map "$request_method:$uri" $kscold_upload_limit_key {
        default "";
        ~^POST:/api/media/upload$ $binary_remote_addr;
        ~^POST:/api/admin/storage/files$ $binary_remote_addr;
    }

    map "$request_method:$uri" $kscold_commercial_limit_key {
        default "";
        ~^POST:/api/payments/ai-agent-bloom/(prepare|complete)$ $binary_remote_addr;
        ~^POST:/api/admin-night/programs/[^/]+/votes$ $binary_remote_addr;
    }

    map "$request_method:$uri" $kscold_engagement_limit_key {
        default "";
        "POST:/api/analytics/page-visit" $binary_remote_addr;
        ~^POST:/api/feeds/[^/]+/like$ $binary_remote_addr;
        ~^POST:/api/feeds/[^/]+/comments/[^/]+/like$ $binary_remote_addr;
    }

    limit_req_zone $kscold_auth_limit_key zone=kscold_auth:10m rate=10r/m;
    limit_req_zone $kscold_recovery_limit_key zone=kscold_recovery:10m rate=3r/m;
    limit_req_zone $kscold_external_limit_key zone=kscold_external:10m rate=10r/m;
    limit_req_zone $kscold_upload_limit_key zone=kscold_upload:10m rate=6r/m;
    limit_req_zone $kscold_commercial_limit_key zone=kscold_commercial:10m rate=6r/m;
    limit_req_zone $kscold_engagement_limit_key zone=kscold_engagement:10m rate=30r/m;

    server_tokens off;
    sendfile        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    # 소스 저장소 업로드 대비 — 백엔드 한도(100MB)와 맞춘다.
    client_max_body_size 100M;

    # 검색·AI·광고 크롤러가 다녀갔는지만 종류별로 남긴다. 일반 방문자는 "-" 로 두어 식별 정보를 남기지 않는다.
    # 정규식은 위에서부터 먼저 맞는 것이 쓰이므로 구체적인 이름을 앞에 둔다.
    map $http_user_agent $kscold_crawler {
        default "-";
        ~*mediapartners-google "google-adsense";
        ~*adsbot-google "google-adsbot";
        ~*google-inspectiontool "google-inspection";
        ~*googleother "google-other";
        ~*googlebot "googlebot";
        ~*(yeti|naverbot) "naver";
        ~*(bingbot|msnbot) "bing";
        ~*(daumoa|daum/) "daum";
        ~*duckduckbot "duckduckgo";
        ~*yandexbot "yandex";
        ~*applebot "apple";
        ~*(gptbot|chatgpt-user|oai-searchbot) "openai";
        ~*(claudebot|claude-user|claude-searchbot|anthropic-ai) "anthropic";
        ~*perplexity "perplexity";
        ~*bytespider "bytedance";
        ~*ccbot "commoncrawl";
        ~*(facebookexternalhit|meta-externalagent) "meta";
        ~*(kakaotalk-scrap|twitterbot|slackbot|discordbot|telegrambot|linkedinbot|whatsapp) "link-preview";
    }

    # 쿼리·IP·사용자 식별 정보를 제외한 운영 진단용 로그 포맷
    log_format main escape=json '$time_iso8601 request_id=$request_id host=$host '
                    'method=$request_method uri=$uri status=$status '
                    'bytes=$body_bytes_sent request_time=$request_time '
                    'upstream_time=$upstream_response_time crawler=$kscold_crawler';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # gzip 압축
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/manifest+json
        application/xml
        application/xml+rss
        image/svg+xml;

    # 사이트별 설정 로드
    include /etc/nginx/conf.d/*.conf;
}
