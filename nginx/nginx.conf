worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 빈 키는 제한 대상에서 제외된다. 비용·인증 위험이 큰 공개 요청만 IP 단위로 제한한다.
    map "$request_method:$uri" $kscold_auth_limit_key {
        default "";
        ~^POST:/api/auth/(login|register)$ $binary_remote_addr;
    }

    map "$request_method:$uri" $kscold_recovery_limit_key {
        default "";
        ~^POST:/api/auth/(recover-username|request-password-reset)$ $binary_remote_addr;
        "POST:/api/team/private" $binary_remote_addr;
    }

    map "$request_method:$uri" $kscold_external_limit_key {
        default "";
        ~^GET:/api/github/ $binary_remote_addr;
        ~^POST:/api/vault/agent/chat(/stream)?$ $binary_remote_addr;
        ~^POST:/api/feed-copilot/(plan|draft)$ $binary_remote_addr;
    }

    limit_req_zone $kscold_auth_limit_key zone=kscold_auth:10m rate=10r/m;
    limit_req_zone $kscold_recovery_limit_key zone=kscold_recovery:10m rate=3r/m;
    limit_req_zone $kscold_external_limit_key zone=kscold_external:10m rate=10r/m;

    server_tokens off;
    sendfile        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    # 소스 저장소 업로드 대비 — 백엔드 한도(100MB)와 맞춘다.
    client_max_body_size 100M;

    # 로그 포맷
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # gzip 압축
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/manifest+json
        application/xml
        application/xml+rss
        image/svg+xml;

    # 사이트별 설정 로드
    include /etc/nginx/conf.d/*.conf;
}
