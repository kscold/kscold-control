name: PR Title Lint

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-title:
    name: Validate Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed Conventional Commit types
          types: |
            feat
            fix
            refactor
            docs
            chore
            test
            perf
            ci
            build
            style
            revert
          # Scopes are optional but recommended, e.g. feat(frontend):
          requireScope: false
          # Subject may start with an uppercase acronym (FSD, JWT, SSL) or Korean,
          # so we only require a non-empty subject — no leading-case restriction.
          subjectPattern: .+
          subjectPatternError: |
            The subject "{subject}" must not be empty.
