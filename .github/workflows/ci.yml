name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 package.json의 "packageManager" 필드를 따른다.
      # version을 명시하면 ERR_PNPM_BAD_PM_VERSION(중복 지정) 오류가 발생한다.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency security
        run: pnpm audit --audit-level low

      - name: Test dependency security regressions
        run: pnpm test:dependency-security

      - name: Check public source boundary
        run: pnpm check:public-source

      - name: Check release version contract
        run: pnpm check:version && pnpm test:release-version

      - name: Migration compatibility tests
        run: node --test scripts/test/migration-compatibility.test.mjs

      - name: Lint
        run: pnpm lint

      - name: Check architecture boundaries
        run: pnpm check:architecture

      - name: Check runtime contracts
        run: pnpm check:runtime-contracts

      - name: Check Nginx configuration
        run: pnpm check:nginx

      - name: Backend tests
        run: pnpm test:backend

      - name: Frontend tests
        run: pnpm test:frontend

      - name: Repository maintenance tests
        run: pnpm test:repository-maintenance

      - name: Build
        run: pnpm build

      - name: Install browser for bundle verification
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify browser bundle without production services
        run: pnpm test:frontend-bundle

      - name: Verify release artifacts
        run: pnpm verify:release
