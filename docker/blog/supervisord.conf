[unix_http_server]
file=/run/blog/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/blog/supervisord.pid
childlogdir=/run/blog
minfds=64000
environment=BLOG_MONGODB_HOST="127.0.0.1:27017",API_INTERNAL_URL="http://127.0.0.1:8080/api",VAULT_AGENT_GRPC_HOST="127.0.0.1",VAULT_AGENT_GRPC_PORT="9090",QDRANT_URL="http://127.0.0.1:6333"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/blog/supervisor.sock

[program:mongod]
command=/usr/bin/mongod --dbpath /data/db --bind_ip_all --auth --wiredTigerCacheSizeGB 0.5
environment=GLIBC_TUNABLES="glibc.pthread.rseq=0"
user=mongodb
priority=10
autostart=true
autorestart=unexpected
startsecs=5
stopwaitsecs=90
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:qdrant]
command=/usr/local/bin/qdrant --config-path /etc/qdrant/config.yaml --disable-telemetry
directory=/qdrant
user=1000
priority=10
autostart=true
autorestart=unexpected
startsecs=5
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=/opt/agent-venv/bin/python /usr/local/lib/blog/launch.py api
priority=30
autostart=%(ENV_API_AUTOSTART)s
autorestart=unexpected
startsecs=10
startretries=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=/opt/agent-venv/bin/python /usr/local/lib/blog/launch.py web
priority=40
autostart=%(ENV_WEB_AUTOSTART)s
autorestart=unexpected
startsecs=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:agent]
command=/opt/agent-venv/bin/python /usr/local/lib/blog/launch.py agent
priority=20
autostart=%(ENV_AGENT_AUTOSTART)s
autorestart=unexpected
startsecs=5
startretries=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
