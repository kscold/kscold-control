name: gadoc-runtime

services:
  ubuntu-gadoc:
    image: kscold/ubuntu-gadoc:2026-10-29-r2
    container_name: ubuntu-gadoc
    hostname: ubuntu-gadoc
    restart: unless-stopped
    stop_grace_period: 45s
    cpus: '2'
    mem_limit: 3g
    environment:
      TZ: Asia/Seoul
      GADOC_START_RUNTIME: ${GADOC_START_RUNTIME:-0}
    ports:
      - '${GADOC_SSH_BIND:-127.0.0.1}:${GADOC_SSH_PORT:-2228}:22'
    volumes:
      - gadoc-mongo-data:/data/db
      - gadoc-app-data:/app
      - gadoc-developer-home:/home/gadoc
      - gadoc-pm2-data:/root/.pm2
      - type: bind
        source: ${GADOC_PRIVATE_DIR:?GADOC_PRIVATE_DIR must point to private migration files}/hostkeys
        target: /run/gadoc-private/hostkeys
        read_only: true
      - type: bind
        source: ${GADOC_PRIVATE_DIR:?GADOC_PRIVATE_DIR must point to private migration files}/authorized
        target: /run/gadoc-private/authorized
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, SYS_CHROOT, NET_BIND_SERVICE, AUDIT_WRITE, KILL]
    networks:
      - application

networks:
  application:
    external: true
    name: kscold-control_default

volumes:
  gadoc-mongo-data:
    external: true
    name: gadoc-mongo-data
  gadoc-app-data:
    external: true
    name: gadoc-app-data
  gadoc-developer-home:
    external: true
    name: gadoc-developer-home
  gadoc-pm2-data:
    external: true
    name: gadoc-pm2-data
