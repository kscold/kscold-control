########################################################
# kscold-control 인프라 — Docker Desktop에서 통합 관리
#
# 구조:
#   nginx           → ALB (SSL 종료 + 리버스 프록시)
#   kscold-infra-db → RDS (공유 PostgreSQL)
#   ubuntu-galjido  → EC2 인스턴스 (갈지도 프로젝트)
#
# 새 프로젝트 추가 시:
#   1. 이 파일에 ubuntu-xxx 서비스 추가
#   2. nginx/conf.d/xxx.conf 프록시 설정 추가
#   3. docker compose up -d
########################################################

services:

  # ===== 게이트웨이 (ALB) =====
  nginx:
    image: nginx:alpine
    container_name: kscold-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - certbot-webroot:/var/www/certbot
      - /Users/kscold/Desktop/bucket:/var/www/bucket:ro
    depends_on:
      - ubuntu-galjido
    restart: unless-stopped

  # ===== 공유 DB (RDS) =====
  kscold-infra-db:
    image: postgres:15-alpine
    container_name: kscold-infra-db
    environment:
      POSTGRES_DB: ${INFRA_DB_NAME:-kscold-infra-db}
      POSTGRES_USER: ${INFRA_DB_USER:-admin}
      POSTGRES_PASSWORD: ${INFRA_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - infra-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  # ===== 갈지도 인스턴스 (EC2) =====
  ubuntu-galjido:
    image: kscold/ubuntu-galjido:latest
    container_name: ubuntu-galjido
    command: bash -c "/entrypoint.sh"
    ports:
      - "2223:22"
      - "5433:5432"
      - "8081:8080"
    cpus: '2'
    mem_limit: 4g
    restart: unless-stopped

  # ===== 콩방 인스턴스 (EC2) =====
  ubuntu-congbang:
    image: kscold/ubuntu-congbang:latest
    container_name: ubuntu-congbang
    command: /entrypoint.sh
    ports:
      - "2224:22"
      - "8082:8080"
      - "3001:3000"
    environment:
      - FILE_UPLOAD_DIR=/opt/congbang/uploads
      - MINIO_ENABLED=true
      - MINIO_ENDPOINT=http://host.docker.internal:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=congbang
      - MINIO_PUBLIC_URL=https://bucket.kscold.com
    volumes:
      - congbang-uploads:/opt/congbang/uploads
    cpus: '2'
    mem_limit: 3g
    restart: unless-stopped

  # ===== kscold 블로그 인스턴스 (EC2) =====
  ubuntu-blog:
    image: kscold/ubuntu-blog:latest
    container_name: ubuntu-blog
    command: /entrypoint.sh
    ports:
      - "2225:22"
      - "8083:8080"
      - "3002:3000"
      - "27019:27017"
    environment:
      - MONGODB_URI=${BLOG_MONGODB_URI}
      - JWT_SECRET=${BLOG_JWT_SECRET}
      - JWT_REFRESH_SECRET=${BLOG_JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRATION=3600000
      - JWT_REFRESH_EXPIRATION=604800000
      - CORS_ORIGINS=https://kscold.com
      - FILE_UPLOAD_DIR=/app/uploads
      - MINIO_ENDPOINT=http://host.docker.internal:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=blog
      - MINIO_PUBLIC_URL=https://bucket.kscold.com
    volumes:
      - blog-uploads:/app/uploads
      - blog-mongo-data:/data/db
    cpus: '2'
    mem_limit: 3g
    restart: unless-stopped

  # ===== Slacord 인스턴스 (EC2) =====
  ubuntu-slacord:
    image: kscold/ubuntu-slacord:latest
    container_name: ubuntu-slacord
    command: /entrypoint.sh
    env_file:
      - ./env/slacord.env
    ports:
      - "2226:22"
      - "8084:8082"
      - "3003:3002"
      - "27020:27017"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8082
      - INTERNAL_API_URL=http://127.0.0.1:8082
      - NEXT_PUBLIC_APP_URL=https://slacord.kscold.com
      - NEXT_PUBLIC_API_URL=https://slacord.kscold.com
    volumes:
      - slacord-mongo-data:/data/db
    cpus: '2'
    mem_limit: 3g
    restart: unless-stopped

volumes:
  infra-db-data:
  certbot-webroot:
  congbang-uploads:
  blog-uploads:
  blog-mongo-data:
  slacord-mongo-data:
